<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | SafeChoice AI</title>

<style>

:root{
    --bg-main:#fff7fb;
    --bg-card:#ffffff;
    --bg-soft:#f3e8ff;
    --text-main:#2d1b35;
    --text-muted:#6b7280;
    --border:#f0d5ff;
    --primary:#ec4899;
    --primary-hover:#db2777;
    --shadow:0 10px 30px rgba(0,0,0,0.08);
}

body.dark-mode{
    --bg-main:#1f1029;
    --bg-card:#2d1b3a;
    --bg-soft:#3b2a4a;
    --text-main:#f9e8ff;
    --text-muted:#d8b4fe;
    --border:#4c1d5f;
    --primary:#ec4899;
    --primary-hover:#f472b6;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:var(--bg-main);
    color:var(--text-main);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-container{
    width:100%;
    max-width:430px;
}

.auth-card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:28px;
    padding:36px 30px;
    box-shadow:var(--shadow);
}

.logo-badge{
    display:inline-block;
    background:var(--primary);
    color:white;
    padding:8px 16px;
    border-radius:999px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:18px;
}

.auth-title{
    font-size:32px;
    font-weight:800;
    margin-bottom:10px;
}

.auth-subtitle{
    color:var(--text-muted);
    line-height:1.6;
    margin-bottom:28px;
    font-size:15px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
}

.form-group input{
    width:100%;
    padding:15px;
    border-radius:16px;
    border:1px solid var(--border);
    background:var(--bg-soft);
    color:var(--text-main);
    font-size:15px;
    outline:none;
}

.form-group input:focus{
    border-color:var(--primary);
}

.auth-btn{
    width:100%;
    border:none;
    background:var(--primary);
    color:white;
    padding:15px;
    border-radius:16px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
}

.auth-btn:hover{
    background:var(--primary-hover);
}

.auth-footer{
    margin-top:24px;
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
}

.auth-footer a{
    color:var(--primary);
    text-decoration:none;
    font-weight:700;
}

.back-home{
    display:inline-block;
    margin-top:18px;
    color:var(--text-muted);
    text-decoration:none;
    font-size:14px;
}

.errorlist{
    list-style:none;
    padding:0;
    margin:8px 0 0;
    color:#ef4444;
    font-size:13px;
}

@media(max-width:480px){

    .auth-card{
        padding:28px 22px;
        border-radius:24px;
    }

    .auth-title{
        font-size:26px;
    }
}

</style>
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo-badge">
            SafeChoice AI
        </div>

        <div class="auth-title">
            Welcome Back 👋
        </div>

        <div class="auth-subtitle">
            Login to continue your contraceptive health conversations and access your saved chat history.
        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label>Password</label>
                {{ form.password }}
            </div>

            {% if form.errors %}
            <ul class="errorlist">
                <li>Invalid username or password.</li>
            </ul>
            {% endif %}

            <button type="submit" class="auth-btn">
                Login
            </button>

        </form>

        <div class="auth-footer">
            Don’t have an account?
            <a href="{% url 'signup' %}">
                Create Account
            </a>
        </div>

        <a href="{% url 'chat_ui' %}" class="back-home">
            ← Back to Chat
        </a>

    </div>

</div>

<script>

const savedTheme = localStorage.getItem("theme");

if(savedTheme === "dark"){
    document.body.classList.add("dark-mode");
}

</script>

</body>
</html>
