<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | SafeChoice AI</title>

<style>
:root {
    --bg-main: #fff7fb;
    --bg-card: #ffffff;
    --bg-bot: #f3e8ff;
    --bg-user: #ec4899;
    --text-main: #2d1b35;
    --text-muted: #6b7280;
    --border-color: #f0d5ff;
    --button-main: #ec4899;
    --button-hover: #db2777;
    --faq-bg: #8b5cf6;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff7fb, #f3e8ff);
    min-height: 100vh;
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.auth-container {
    width: 100%;
    max-width: 430px;
}

.auth-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(124, 58, 237, 0.18);
}

.logo {
    text-align: center;
    margin-bottom: 18px;
}

.logo h1 {
    margin: 0;
    font-size: 26px;
    color: var(--text-main);
}

.logo p {
    margin: 8px 0 0;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.5;
}

.auth-title {
    font-size: 22px;
    margin: 18px 0 6px;
    text-align: center;
}

.auth-subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 22px;
}

form p {
    margin-bottom: 14px;
}

form label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
}

form input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 14px;
    border: 1px solid var(--border-color);
    outline: none;
    background: #fff;
    color: var(--text-main);
    font-size: 15px;
}

form input:focus {
    border-color: var(--button-main);
    box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.15);
}

ul.errorlist {
    color: #dc2626;
    font-size: 13px;
    margin: 6px 0;
    padding-left: 18px;
}

.auth-btn {
    width: 100%;
    border: none;
    background: var(--button-main);
    color: white;
    padding: 14px;
    border-radius: 16px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 6px;
}

.auth-btn:hover {
    background: var(--button-hover);
}

.auth-links {
    margin-top: 20px;
    text-align: center;
    display: grid;
    gap: 10px;
}

.auth-links a {
    color: var(--faq-bg);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
}

.auth-links a:hover {
    text-decoration: underline;
}

.privacy-note {
    background: var(--bg-bot);
    padding: 12px 14px;
    border-radius: 16px;
    font-size: 13px;
    color: var(--text-main);
    line-height: 1.5;
    margin-bottom: 18px;
}

@media (max-width: 480px) {
    body {
        padding: 14px;
        align-items: flex-start;
    }

    .auth-card {
        padding: 22px;
        border-radius: 20px;
        margin-top: 18px;
    }

    .logo h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="logo">
            <h1>SafeChoice AI</h1>
        </div>

        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">
            Login only if you want to save and access your chats later.
        </p>

        <div class="privacy-note">
            You can continue using the chatbot anonymously without logging in.
        </div>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="auth-btn">
                Login
            </button>
        </form>

        <div class="auth-links">
            <a href="{% url 'signup' %}">Create an optional account</a>
            <a href="{% url 'chat_ui' %}">Continue as guest</a>
        </div>

    </div>
</div>

</body>
</html>
